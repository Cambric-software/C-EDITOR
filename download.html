<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C EDITOR - Download</title>
    <meta name="description" content="C EDITOR by Cambric Software: a document and creative suite. Download for Windows, Linux and Android.">
    <meta name="theme-color" content="#12141a">
    <link rel="icon" type="image/png" href="app/assets/c-editor-icon-transparent.png">
    <style>
  :root {
    --bg: #0e1015;
    --surface: #171a22;
    --surface-2: #1e222c;
    --border: #2a2f3b;
    --text: #e8eaf0;
    --muted: #9aa3b5;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f0f2f7;
      --border: #e0e3ec;
      --text: #171a22;
      --muted: #5c6474;
      --shadow: 0 8px 24px rgba(20, 24, 40, .08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header {
    padding: 64px 0 40px;
    background: linear-gradient(180deg, rgba(91,140,255,.14), transparent 70%);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: .2px; }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    display: block; flex: none; object-fit: contain;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .14);
  }
  h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.15; margin: 28px 0 12px; }
  .tagline { font-size: clamp(16px, 2.2vw, 20px); color: var(--muted); max-width: 62ch; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: var(--radius);
    background: var(--accent); color: #0b1020; font-weight: 600;
    text-decoration: none; border: 1px solid transparent;
  }
  .btn.secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .btn:hover { filter: brightness(1.08); }
  footer { padding: 32px 0; color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img class="logo" src="app/assets/c-editor-icon-transparent.png" alt="C EDITOR logo">
        <span>C EDITOR</span>
      </div>
      <h1>C EDITOR</h1>
      <p class="tagline">A document and creative suite. Windows, Linux and Android.</p>
      <div class="cta">
        <a class="btn" href="#">Download for Windows</a>
        <a class="btn secondary" href="#">Download for Linux</a>
        <a class="btn secondary" href="#">Download for Android</a>
      </div>
    </div>
  </header>
  <footer>
    <div class="wrap">
      <p>? 2025-2026 Cambric. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>

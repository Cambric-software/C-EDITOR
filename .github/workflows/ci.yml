name: CI

on:
  push:
  pull_request:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Dart analyze
        working-directory: app
        run: flutter analyze

  # No tests yet; add when available.